<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="logo">🚀</div>
        <h2 class="title">Acceso Restringido</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form onsubmit="return validarLogin(event);">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <span class="input-icon"></span>
              <input
                type="email"
                id="email"
                placeholder="tu@correo.com"
                required
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <span class="input-icon"></span>
              <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>
          </div>

          <div class="remember-forgot">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" />
              <label for="remember">Recordarme</label>
            </div>
            <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
          </div>

          <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

        <div class="divider">
          <span>O continúa con</span>
        </div>

        <div class="social-login">
          <button class="social-btn" type="button" title="Google">🔵</button>
          <button class="social-btn" type="button" title="Facebook">📘</button>
          <button class="social-btn" type="button" title="Apple">🍎</button>
        </div>

        <p class="register-link">
          ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
        </p>
      </div>
    </div>

    <script>
      function validarLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        console.log("Email:", email);
        console.log("Password:", password);

        alert("¡Login exitoso! ");

        // Redirigir a la landing page
        window.location.href = "landingpage.html";

        return false;
      }
    </script>

    <script src="login.js"></script>
  </body>
</html>
